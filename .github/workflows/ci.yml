name: Build GPT Quota Bar

on:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build windows/QuotaBlocksWin.csproj -c Release --nologo -warnaserror
